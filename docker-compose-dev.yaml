name: tp0
services:
    client1:
        container_name: client1
        image: client:latest
        entrypoint: /client
        environment:
            - CLI_ID=1
            - CLI_DATASET_FILEPATH=/data/agency-1.csv
        depends_on:
            - server
        networks:
            - testing_net
        volumes:
            - ./client/config.yaml:/config.yaml
            - ./.data/dataset/agency-1.csv:/data/agency-1.csv
    server:
        container_name: server
        image: server:latest
        entrypoint: /server
        environment: []
        networks:
            - testing_net
        volumes:
            - ./server/config.ini:/config.ini
networks:
    testing_net:
        ipam:
            driver: default
            config:
                - subnet: 172.25.125.0/24
